# Central configuration for the Math Track (Partner A)

models:
  llama3.2-1b: "meta-llama/Llama-3.2-1B-Instruct"
  llama3.2-3b: "meta-llama/Llama-3.2-3B-Instruct"
  max_new_tokens: 512
  dtype: "bfloat16"          # use "float16" if bfloat16 unsupported on your GPU
  load_in_4bit: false        # set true to fit 3B on a smaller GPU

datasets:
  gsm8k:
    hf_name: "openai/gsm8k"
    hf_config: "main"
    test_split: "test"
  math:
    hf_name: "nlile/hendrycks-MATH-benchmark"   # mirror; original hendrycks/competition_math was taken down
    test_split: "test"

greedy:
  temperature: 0.0           # greedy = no sampling

best_of_n:
  n_candidates: 8
  temperature: 0.8
  top_p: 0.95

self_consistency:
  n_samples: 8
  temperature: 0.7
  top_p: 0.95

tree_search:
  branching_factor: 3
  max_depth: 4
  temperature: 0.7
  beam_width: 2               # how many partial paths survive each pruning step

verifier:
  base_model: "microsoft/deberta-v3-small"   # small, cheap classifier head
  max_length: 512
  train_epochs: 3
  batch_size: 16
  lr: 1.0e-5
  # positive examples: (problem, correct solution) pairs
  # negative examples: (problem, incorrect candidate) pairs sampled from best_of_n/self_consistency runs

router_threshold:
  # legacy threshold-on-verifier-confidence router — preserved for comparison,
  # see src/strategies/router_threshold.py / scripts/run_router_threshold.py.
  # src/strategies/router.py (below) is now the primary, stronger router.
  difficulty_features:
    - "verifier_confidence"
    - "problem_length_tokens"
    - "self_consistency_agreement"
  easy_strategy: "greedy"
  hard_strategy: "tree_search"
  threshold: 0.6

router:
  # Learned Latent Router — ported from the code track's LatentRouterNet
  # per mentor feedback ("should be more strong"). See
  # src/strategies/router.py and scripts/train_router.py.
  type: "learned_latent"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  hidden_dim: 64
  latent_dim: 16
  epochs: 30
  lr: 0.001
  strategies_available: ["greedy", "best_of_n", "self_consistency", "tree_search"]
  cost_penalty_lambda: 0.05

paths:
  logs_dir: "logs"
  checkpoints_dir: "checkpoints"
  results_dir: "logs/results"

hf_hub:
  repo_id: "iamsubham019/math-track-ttc-scaling"
  private: true

hub:
  # Used by shared/hub_utils.py (JSON-checkpoint-based, code-track-style push/pull —
  # router training progress and weights go here). Points at the same repo as
  # hf_hub above; kept as a separate key so the existing logs/checkpoints backup
  # flow (src/hub_utils.py, used throughout earlier rounds) is untouched.
  repo_id: "iamsubham019/math-track-ttc-scaling"
  private: true
  push_every_n_problems: 10
